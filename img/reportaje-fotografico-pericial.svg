<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Los cuatro pasos del reportaje fotográfico de un informe pericial (separar las fotos por vehículo, elegirlas, ordenarlas y escribir el pie de cada una) y una página del PDF con la matrícula, una general y el daño en vista abierta y de detalle</title><rect x="0" y="0" width="1200" height="630" rx="0" fill="#f6f6f4"/><text x="60" y="64" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4b3fe0" text-anchor="start" letter-spacing="2">INFORME PERICIAL</text><text x="60" y="98" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="24" font-weight="600" fill="#111114" text-anchor="start">El reportaje fotográfico, paso a paso</text><rect x="60" y="136" width="560" height="84" rx="16" fill="#ffffff" stroke="#e7e7e2"/><circle cx="104" cy="178" r="20" fill="#f1eefe"/><text x="104" y="185" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b3fe0" text-anchor="middle">1</text><text x="142" y="174" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#111114" text-anchor="start">Separa las fotos de cada vehículo</text><text x="142" y="198" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#4a4a52" text-anchor="start">en su carpeta, sin tocar los originales</text><rect x="60" y="236" width="560" height="84" rx="16" fill="#ffffff" stroke="#e7e7e2"/><circle cx="104" cy="278" r="20" fill="#f1eefe"/><text x="104" y="285" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b3fe0" text-anchor="middle">2</text><text x="142" y="274" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#111114" text-anchor="start">Elige las que entran</text><text x="142" y="298" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#4a4a52" text-anchor="start">de cada daño, una abierta y una cerrada</text><rect x="60" y="336" width="560" height="84" rx="16" fill="#ffffff" stroke="#e7e7e2"/><circle cx="104" cy="378" r="20" fill="#f1eefe"/><text x="104" y="385" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b3fe0" text-anchor="middle">3</text><text x="142" y="374" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#111114" text-anchor="start">Ordénalas como se lee</text><text x="142" y="398" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#4a4a52" text-anchor="start">identificación, generales y daños</text><rect x="60" y="436" width="560" height="84" rx="16" fill="#ffffff" stroke="#e7e7e2"/><circle cx="104" cy="478" r="20" fill="#f1eefe"/><text x="104" y="485" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b3fe0" text-anchor="middle">4</text><text x="142" y="474" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#111114" text-anchor="start">Un pie debajo de cada foto</text><text x="142" y="498" font-family="Segoe UI, Inter, -apple-system, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#4a4a52" text-anchor="start">qué se ve, dónde y en qué foto</text><path d="M636,330 H668" stroke="#6e63ea" stroke-width="2.5" stroke-linecap="round"/><path d="M662,322 L676,330 L662,338" fill="none" stroke="#6e63ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(2 930 330)"><rect x="712" y="128" width="440" height="424" rx="8" fill="#e4e2ee"/></g><rect x="700" y="118" width="440" height="424" rx=