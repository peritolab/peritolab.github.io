<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vídeo · PeritoLab</title>
<meta name="description" content="Vídeo de PeritoLab.">
<meta name="theme-color" content="#0c0b11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236246EA'/%3E%3Cpath d='M11.5 23V9h5a4.6 4.6 0 0 1 0 9.2h-5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21.8' cy='22.6' r='1.9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="estilo.css?v=f74b07d11f">
<style>
  .player { padding: 120px 0 90px; }
  .player .wrap { max-width: 980px; }
  .player video { display: block; width: 100%; max-height: 72vh; border-radius: 16px; background: #000; box-shadow: inset 0 0 0 1px var(--line); }
  .player .bajo { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 14.5px; }
  .player .bajo a { color: var(--accent-3); }
  .player .nada { padding: 60px 24px; text-align: center; color: var(--muted); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#6246EA"/><path d="M11.5 23V9h5a4.6 4.6 0 0 1 0 9.2h-5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.8" cy="22.6" r="1.9" fill="#fff"/></symbol>
</svg>
<header class="nav scrolled">
  <div class="wrap">
    <a class="brand" href="./" aria-label="PeritoLab, inicio"><svg aria-hidden="true"><use href="#logo"/></svg>PeritoLab</a>
    <nav class="nav-links" aria-label="Principal">
      <a href="matriculas.html">Matrículas</a>
      <a href="compresor.html">Compresor</a>
    </nav>
    <a class="btn btn-light btn-sm" href="matriculas.html">Descubrir Matrículas</a>
  </div>
</header>
<main class="player" id="contenido">
  <div class="wrap">
    <div id="hueco"><p class="nada">Cargando el vídeo…</p></div>
    <div class="bajo">
      <span>PeritoLab · software para peritos y gabinetes periciales</span>
      <span><a id="descargar" href="#" hidden>Descargar el vídeo</a></span>
    </div>
  </div>
</main>
<footer class="foot">
  <div class="wrap">
    <div class="foot-legal" style="margin-top:0;border-top:0;padding-top:0">
      <span>© PeritoLab</span>
      <span><a href="aviso-legal.html">Aviso legal</a> · <a href="condiciones.html">Condiciones</a> · <a href="privacidad.html">Privacidad</a> · <a href="mailto:contacto.peritolab@gmail.com">contacto.peritolab@gmail.com</a></span>
    </div>
  </div>
</footer>
<script>
  // Los vídeos de los correos (PeritoLab Gestión los sube a la carpeta «v/» de esta web):
  // video.html#nombre-del-video.mp4. Solo nombres de ese sitio, nada de direcciones de fuera.
  (function () {
    var nombre = decodeURIComponent(location.hash.slice(1));
    var hueco = document.getElementById("hueco");
    if (!/^[\w.-]+\.(mp4|mov|m4v|webm)$/i.test(nombre)) {
      hueco.innerHTML = '<p class="nada">Este enlace no lleva a ningún vídeo.</p>';
      return;
    }
    var url = "v/" + encodeURIComponent(nombre);          // en esta misma web: se sirve como vídeo
    var video = document.createElement("video");
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.src = url;
    video.addEventListener("error", function () {
      hueco.innerHTML = '<p class="nada">No se puede reproducir aquí. Puedes descargarlo con el enlace de abajo.</p>';
    });
    hueco.innerHTML = "";
    hueco.appendChild(video);
    var bajar = document.getElementById("descargar");
    bajar.href = url;
    bajar.hidden = false;
  })();
</script>
</body>
</html>
